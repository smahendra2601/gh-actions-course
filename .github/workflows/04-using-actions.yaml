name : 04 - Using Actions
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        #checkout the code
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: '24.x'
        # Install dependencies of our react app
            - name: Install dependencies
              run: npm ci
        # Run automated tests